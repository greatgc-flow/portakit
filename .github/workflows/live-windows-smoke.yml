name: Live Windows archive smoke

on:
  workflow_dispatch:
  # Real-asset smoke on relevant PRs or by manual dispatch; no push/release job.
  pull_request:
    paths:
      - .github/workflows/live-windows-smoke.yml
      - portakit.py
      - catalog.json
      - toolsets.json
      - scripts/toolsets.py

permissions:
  contents: read

concurrency:
  group: portakit-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-archives:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download pinned assets, check bundled plugins, and remove
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ("portakit-live-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $root | Out-Null
          try {
            $items = @(
              @{ Id = 'notepad++'; Exe = 'notepad++.exe'; PluginDir = 'plugins' },
              @{ Id = 'winmerge'; Exe = 'WinMergeU.exe'; PluginDir = 'MergePlugins' },
              @{ Id = 'jq'; Exe = 'jq.exe'; PluginDir = $null }
            )
            foreach ($item in $items) {
              $id = $item.Id
              Write-Host "Installing pinned $id"
              $output = python -I portakit.py --json --root "$root" install $id
              if ($LASTEXITCODE -ne 0) { throw "$id install failed: $output" }
              $installed = $output | ConvertFrom-Json
              if (-not $installed.ok -or -not $installed.data.changed) {
                throw "$id install returned an unexpected envelope"
              }
              $dir = Join-Path $root $id
              $exe = Join-Path $dir $item.Exe
              if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
                throw "$id executable missing at $exe"
              }
              if ($item.PluginDir) {
                $pluginPath = Join-Path $dir $item.PluginDir
                if (-not (Test-Path -LiteralPath $pluginPath -PathType Container)) {
                  throw "$id bundled plugin folder absent: $pluginPath"
                }
                $files = @(Get-ChildItem -LiteralPath $pluginPath -File -Recurse -ErrorAction Stop)
                if ($files.Count -eq 0) { throw "$id shipped no plugin files in $pluginPath" }
                Write-Host "$id has $($files.Count) bundled plugin files"
                $files | Select-Object -First 15 -ExpandProperty Name | ForEach-Object { Write-Host "  $_" }
              }
              if ($id -eq 'jq') {
                & $exe --version
                if ($LASTEXITCODE -ne 0) { throw "jq --version failed" }
              }
              $noOp = python -I portakit.py --json --root "$root" update $id
              if ($LASTEXITCODE -ne 0) { throw "$id no-op update failed" }
              $check = $noOp | ConvertFrom-Json
              if (-not $check.ok -or $check.data.changed) {
                throw "$id identical-pin update must not download or modify files"
              }
              if ($id -in @('notepad++', 'winmerge')) {
                $marker = Join-Path $dir 'user-keep.txt'
                Set-Content -LiteralPath $marker -Value 'keep' -Encoding ascii
                $statePath = Join-Path $root '.portakit-state.json'
                $beforeHash = (Get-FileHash -LiteralPath $statePath -Algorithm SHA256).Hash
                $confOutput = python -I portakit.py --json --root "$root" configure $id
                if ($LASTEXITCODE -ne 0) { throw "$id configure failed: $confOutput" }
                $configured = $confOutput | ConvertFrom-Json
                if (-not $configured.ok -or -not $configured.data.changed) {
                  throw "$id first configure should change existing default installation"
                }
                if ((Get-FileHash -LiteralPath $statePath -Algorithm SHA256).Hash -ne $beforeHash) {
                  throw "$id configure mutated package version/state"
                }
                if ((Get-Content -LiteralPath $marker -Raw).Trim() -ne 'keep') {
                  throw "$id lost unrelated user data"
                }
                if ($id -eq 'notepad++') {
                  foreach ($plugin in @('ComparePlus\ComparePlus.dll','JsonTools\JsonTools.dll')) {
                    if (-not (Test-Path -LiteralPath (Join-Path (Join-Path $dir 'plugins') $plugin) -PathType Leaf)) {
                      throw "$id configure missing plugin $plugin"
                    }
                  }
                } else {
                  $settings = Get-Content -LiteralPath (Join-Path $dir 'WinMerge.ini') -Raw
                  if ($settings -notmatch '(?im)^\s*Settings/UnpackerMode\s*=\s*1\s*$') {
                    throw "$id configure missing automatic Office unpackers"
                  }
                }
                $again = python -I portakit.py --json --root "$root" configure $id
                if ($LASTEXITCODE -ne 0) { throw "$id repeat configure failed" }
                if (($again | ConvertFrom-Json).data.changed) {
                  throw "$id repeat configure must be idempotent"
                }
                Write-Host "$id existing-install configuration and idempotency verified"
              }
              $removed = python -I portakit.py --json --root "$root" remove $id
              if ($LASTEXITCODE -ne 0) { throw "$id removal failed" }
              if (Test-Path -LiteralPath $dir) { throw "$id directory remains after remove" }
            }
            foreach ($id in @('notepad++', 'winmerge')) {
              Write-Host "Installing recommended profile for $id"
              $output = python -I portakit.py --json --root "$root" install $id --recommended
              if ($LASTEXITCODE -ne 0) { throw "$id recommended installation failed: $output" }
              $value = $output | ConvertFrom-Json
              if (-not $value.ok -or -not $value.data.changed) {
                throw "$id unexpected recommended profile envelope"
              }
              $dir = Join-Path $root $id
              if ($id -eq 'notepad++') {
                foreach ($plugin in @('ComparePlus\ComparePlus.dll', 'JsonTools\JsonTools.dll')) {
                  $dll = Join-Path (Join-Path $dir 'plugins') $plugin
                  if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) { throw "Missing plugin $dll" }
                }
                [xml]$xml = Get-Content -LiteralPath (Join-Path $dir 'config.xml') -Raw
                $tab = @($xml.NotepadPlus.GUIConfigs.GUIConfig | Where-Object { $_.name -eq 'TabSetting' })[0]
                if ($tab.size -ne '4' -or $tab.replaceBySpace -ne 'yes') {
                  throw 'Notepad++ recommended tab settings missing'
                }
              } else {
                $required = @(
                  'CompareMSExcelFiles.sct',
                  'CompareMSWordFiles.sct',
                  'CompareMSPowerPointFiles.sct',
                  'CompareMSVisioFiles.sct'
                )
                $expectedExt = @{
                  'CompareMSExcelFiles.sct' = '.xlsx'
                  'CompareMSWordFiles.sct' = '.docx'
                  'CompareMSPowerPointFiles.sct' = '.pptx'
                  'CompareMSVisioFiles.sct' = '.vsdx'
                }
                foreach ($name in $required) {
                  $scriptPath = Join-Path (Join-Path $dir 'MergePlugins') $name
                  if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
                    throw "WinMerge vendor Office script missing: $name"
                  }
                  $text = [System.IO.File]::ReadAllText($scriptPath)
                  if (-not $text.Contains($expectedExt[$name])) {
                    throw "WinMerge Office script $name lacks expected $($expectedExt[$name]) filter"
                  }
                  if (-not [regex]::IsMatch($text, 'function\s+get_PluginIsAutomatic\s*\(\s*\)\s*\{\s*return\s+true\s*;')) {
                    throw "WinMerge Office script $name does not declare automatic selection"
                  }
                  Write-Host "Verified actual Office script $name extension=$($expectedExt[$name]) automatic=true"
                }
                $ini = Get-Content -LiteralPath (Join-Path $dir 'WinMerge.ini') -Raw
                if ($ini -notmatch '(?im)^\s*\[WinMerge\]\s*$') {
                  throw 'WinMerge INI missing [WinMerge] section'
                }
                foreach ($key in @('ViewLineNumbers','PluginsEnabled','UnpackerMode')) {
                  if ($ini -notmatch "(?im)^\s*Settings/$key\s*=\s*1\s*$") {
                    throw "WinMerge setting not enabled: $key"
                  }
                }
                Write-Host 'WinMerge bundled Office plugins and automatic unpacker settings verified (no COM test)'
              }
              python -I portakit.py --root "$root" remove $id
              if ($LASTEXITCODE -ne 0) { throw "$id recommended remove failed" }
            }
            Write-Host 'Running real WinMerge executable smoke against isolated text fixtures'
            $verified = python -I portakit.py --json --root "$root" install winmerge --recommended
            if ($LASTEXITCODE -ne 0 -or -not ($verified | ConvertFrom-Json).ok) {
              throw 'Could not install WinMerge for executable acceptance test'
            }
            $wmExe = Join-Path (Join-Path $root 'winmerge') 'WinMergeU.exe'
            $wmEvidence = Join-Path $env:RUNNER_TEMP 'portakit-winmerge-runtime-evidence'
            & (Join-Path $PWD 'scripts/WinMerge-RuntimeSmoke.ps1') -WinMergeExe $wmExe -EvidenceDir $wmEvidence -TimeoutSeconds 90
            if ($LASTEXITCODE -ne 0) { throw 'Real WinMerge executable smoke FAILED; check artifact' }
            # Prerequisite probe is intentionally non-executing. The only honest
            # result on a hosted runner is NOT_VERIFIED for all four applications,
            # even if one or more COM ProgIDs happen to be registered.
            $officeEvidence = Join-Path $env:RUNNER_TEMP 'portakit-winmerge-office-prerequisites'
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "scripts/WinMerge-OfficeAcceptance.ps1" -WinMergeExe $wmExe -EvidenceDir $officeEvidence -ProbeOnly
            if ($LASTEXITCODE -ne 2) { throw "Office prerequisite-only probe must return NOT_VERIFIED (2), got $LASTEXITCODE" }
            $rows = @(Import-Csv -LiteralPath (Join-Path $officeEvidence 'results.csv'))
            $names = @('Excel', 'Word', 'PowerPoint', 'Visio')
            if ($rows.Count -ne $names.Count) { throw "Expected four Office result rows, got $($rows.Count)" }
            foreach ($name in $names) {
              $match = @($rows | Where-Object { $_.Application -eq $name -and $_.Status -eq 'NOT_VERIFIED' })
              if ($match.Count -ne 1) { throw "Office prerequisite result invalid for $name" }
            }
            if (-not (Test-Path -LiteralPath (Join-Path $officeEvidence 'console.log') -PathType Leaf)) {
              throw 'Office prerequisite transcript missing'
            }
            Write-Host 'Office four-app registration probe recorded NOT_VERIFIED for all four (no COM execution)'
            # The one-run UX must preserve Windows PowerShell 5 compatibility,
            # return NOT_VERIFIED=2 and package SHA-256 evidence without Office.
            $oneRunEvidence = Join-Path $env:RUNNER_TEMP 'portakit-office4-one-run'
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'scripts/Run-WinMerge-Office4.ps1' -Root "$root" -EvidenceDir $oneRunEvidence -ProbeOnly
            if ($LASTEXITCODE -ne 2) {
              throw "Office4 one-run probe must return 2 (NOT_VERIFIED); got $LASTEXITCODE"
            }
            $oneRunZip = $oneRunEvidence + '.zip'
            $oneRunSha = $oneRunZip + '.sha256.txt'
            if (-not (Test-Path -LiteralPath $oneRunZip -PathType Leaf) -or
                -not (Test-Path -LiteralPath $oneRunSha -PathType Leaf)) {
              throw 'Office4 one-run evidence ZIP or SHA-256 sidecar missing'
            }
            $shaLine = [System.IO.File]::ReadAllText($oneRunSha).Trim()
            $actualSha = (Get-FileHash -LiteralPath $oneRunZip -Algorithm SHA256).Hash.ToLowerInvariant()
            if (-not $shaLine.ToLowerInvariant().StartsWith($actualSha + '  ')) {
              throw 'Office4 one-run ZIP checksum mismatch'
            }
            Add-Type -AssemblyName 'System.IO.Compression'
            $z = [System.IO.Compression.ZipFile]::OpenRead($oneRunZip)
            try {
              $manifestEntry = $z.GetEntry('manifest.json')
              if ($null -eq $manifestEntry) { throw 'Evidence manifest missing' }
              $reader = New-Object System.IO.StreamReader($manifestEntry.Open())
              try {
                $manifest = $reader.ReadToEnd() | ConvertFrom-Json
              }
              finally { $reader.Dispose() }
              if ($manifest.office_runtime -ne 'NOT_VERIFIED' -or $manifest.script_exit_code -ne 2) {
                throw 'Office4 probe evidence falsely claims PASS'
              }
            }
            finally { $z.Dispose() }
            $verification = python -I scripts/verify_office_evidence.py --zip $oneRunZip
            if ($LASTEXITCODE -ne 0) {
              throw "Independent ZIP verification rejected Office4 evidence: $verification"
            }
            $verified = $verification | ConvertFrom-Json
            if (-not $verified.verified -or
                $verified.office_runtime -ne 'NOT_VERIFIED' -or
                $verified.applications.Excel -ne 'NOT_VERIFIED' -or
                $verified.applications.Word -ne 'NOT_VERIFIED' -or
                $verified.applications.PowerPoint -ne 'NOT_VERIFIED' -or
                $verified.applications.Visio -ne 'NOT_VERIFIED') {
              throw 'Independent Office evidence verdict incorrect'
            }
            Write-Host 'Office4 independent ZIP, SHA-256, CSV and NOT_VERIFIED checks all passed'
            python -I portakit.py --root "$root" remove winmerge
            if ($LASTEXITCODE -ne 0) { throw 'WinMerge cleanup after executable smoke failed' }
            # Real curated-profile smoke, independent of editor recommended plugins.
            # Empty NW category must do nothing (no network install, no state).
            $beforePlan = python -I scripts/toolsets.py plan nw --root "$root"
            if ($LASTEXITCODE -ne 0 -or -not ($beforePlan -match 'EMPTY:')) {
              throw "Unpinned NW category must be a zero-tool read-only plan"
            }
            $plan = python -I scripts/toolsets.py plan data --root "$root"
            if ($LASTEXITCODE -ne 0 -or -not ($plan -match 'jq')) {
              throw 'Category data must select the pinned jq tool'
            }
            python -I scripts/toolsets.py apply data --root "$root" --yes
            if ($LASTEXITCODE -ne 0) { throw 'Optional pinned data toolset real install failed' }
            if (-not (Test-Path -LiteralPath (Join-Path (Join-Path $root 'jq') 'jq.exe') -PathType Leaf)) {
              throw 'Toolset jq executable missing'
            }
            $installedHash = (Get-FileHash -LiteralPath (Join-Path $root '.portakit-state.json') -Algorithm SHA256).Hash
            python -I scripts/toolsets.py apply data --root "$root" --yes
            if ($LASTEXITCODE -ne 0) { throw 'Toolset idempotent reapply failed' }
            if ((Get-FileHash -LiteralPath (Join-Path $root '.portakit-state.json') -Algorithm SHA256).Hash -ne $installedHash) {
              throw 'Toolset reapply changed current pin state'
            }
            if (@(Get-ChildItem -LiteralPath (Join-Path $root '.portakit-evidence') -Filter 'toolsets-*.log').Count -lt 2) {
              throw 'Toolset install/reapply console evidence logs missing'
            }
            # Verify the 8 newly pinned tiny Windows official ZIP assets end to end.
            # This is an isolated runner root. Every ZIP passes the original
            # SHA-256 validation, safe extraction and executable --version check.
            $tiny = @(
              @{ Id = 'ripgrep'; Exe = 'rg.exe'; ExpectedVersion = '15.2.0' },
              @{ Id = 'fd'; Exe = 'fd.exe'; ExpectedVersion = '10.5.0' },
              @{ Id = 'fzf'; Exe = 'fzf.exe'; ExpectedVersion = '0.74.5' },
              @{ Id = 'bat'; Exe = 'bat.exe'; ExpectedVersion = '0.26.1' },
              @{ Id = 'sd'; Exe = 'sd.exe'; ExpectedVersion = '1.0.0' },
              @{ Id = 'yq'; Exe = 'yq_windows_amd64.exe'; ExpectedVersion = '4.54.1' },
              @{ Id = 'delta'; Exe = 'delta.exe'; ExpectedVersion = '0.20.1' },
              @{ Id = 'hyperfine'; Exe = 'hyperfine.exe'; ExpectedVersion = '2.0.0' }
            )
            $lightPlan = python -I scripts/toolsets.py plan lightweight --root "$root"
            if ($LASTEXITCODE -ne 0 -or @($lightPlan | Select-String 'install').Count -lt 8) {
              throw 'Lightweight profile does not resolve all 8 new pinned installers'
            }
            python -I scripts/toolsets.py apply lightweight --root "$root" --yes
            if ($LASTEXITCODE -ne 0) { throw 'Pinned lightweight CLI profile install failed' }
            foreach ($tool in $tiny) {
              $folder = Join-Path $root $tool.Id
              $bins = @(Get-ChildItem -LiteralPath $folder -Filter $tool.Exe -Recurse -File -ErrorAction Stop)
              if ($bins.Count -ne 1) {
                throw "Expected exactly one executable $($tool.Exe) in $folder, found $($bins.Count)"
              }
              $output = & $bins[0].FullName --version
              if ($LASTEXITCODE -ne 0 -or -not $output) {
                throw "Version smoke failed: $($tool.Id) / $($tool.Exe)"
              }
              $observedVersion = (($output | Out-String).Trim())
              if (-not $observedVersion.Contains($tool.ExpectedVersion)) {
                throw "Version mismatch for $($tool.Id): expected $($tool.ExpectedVersion), observed $observedVersion"
              }
              if ($tool.Id -eq 'sd') {
                # Vendor GitHub release v1.1.0 ZIP (exact SHA pinned) embeds
                # sd.exe reporting 1.0.0. This is an explicit upstream
                # discrepancy, not an assertion of matching semantic versions.
                Write-Warning 'sd upstream v1.1.0 ZIP reports sd 1.0.0; flagged for vendor follow-up'
              }
              Write-Host "PINNED SHA + OFFLINE EXECUTABLE PASS: $($tool.Id): $observedVersion"
            }
            $hashBefore = (Get-FileHash -LiteralPath (Join-Path $root '.portakit-state.json') -Algorithm SHA256).Hash
            python -I scripts/toolsets.py apply lightweight --root "$root" --yes
            if ($LASTEXITCODE -ne 0 -or
                $hashBefore -ne (Get-FileHash -LiteralPath (Join-Path $root '.portakit-state.json') -Algorithm SHA256).Hash) {
              throw 'Lightweight re-apply changed state or failed'
            }
            foreach ($tool in $tiny) {
              python -I portakit.py --root "$root" remove $tool.Id
              if ($LASTEXITCODE -ne 0) { throw "Tiny tool cleanup failed: $($tool.Id)" }
            }
            # Stage exact vendor packages outside the installed tool directories;
            # install them from local original files, never through a downloader.
            $approved = Join-Path $root 'approved-original-assets'
            New-Item -ItemType Directory -Path $approved -Force | Out-Null
            $pinList = @(Get-Content -LiteralPath 'catalog.json' -Raw | ConvertFrom-Json).tools
            $newIds = @('7zr', 'everything', 'grepwin', 'miller', 'dasel')
            foreach ($id in $newIds) {
              $pin = @($pinList | Where-Object { $_.id -eq $id })[0]
              if (-not $pin) { throw "Missing catalog pin: $id" }
              $fileName = [IO.Path]::GetFileName(([uri] $pin.url).AbsolutePath)
              $assetPath = Join-Path $approved $fileName
              Invoke-WebRequest -Uri $pin.url -OutFile $assetPath -UseBasicParsing
              if ((Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) {
                throw "Official vendor artifact SHA mismatch: $id"
              }
              Write-Host "VENDOR ASSET HASH VERIFIED: $id ($((Get-Item -LiteralPath $assetPath).Length) bytes)"
            }
            python -I scripts/toolsets.py plan portable-productivity --root "$root"
            if ($LASTEXITCODE -ne 0) { throw 'Second-wave plan failed' }
            python -I scripts/toolsets.py apply portable-productivity --root "$root" --yes --offline-dir "$approved"
            if ($LASTEXITCODE -ne 0) { throw 'Second-wave local-only bundle install failed' }
            $newBins = @(
              @{ Id='7zr'; Exe='7zr.exe'; Version='26.04'; Gui=$false },
              @{ Id='everything'; Exe='Everything.exe'; Gui=$true },
              @{ Id='grepwin'; Exe='grepWin.exe'; Gui=$true },
              @{ Id='miller'; Exe='mlr.exe'; Version='6.22.0'; Gui=$false },
              @{ Id='dasel'; Exe='dasel.exe'; Version='3.11.2'; Gui=$false }
            )
            foreach ($tool in $newBins) {
              $installed = @(Get-ChildItem -LiteralPath (Join-Path $root $tool.Id) -Recurse -File | Where-Object {
                $_.Name -ieq $tool.Exe -or ($tool.Id -eq 'grepwin' -and $_.Name -match '^grepWin.*\.exe$')
              })
              if ($installed.Count -ne 1) {
                Get-ChildItem -LiteralPath (Join-Path $root $tool.Id) -Recurse -File |
                  ForEach-Object { Write-Host "VENDOR ZIP MEMBER: $($_.Name)" }
                throw "Expected one installed $($tool.Exe) in $($tool.Id), found $($installed.Count)"
              }
              $first = [IO.File]::ReadAllBytes($installed[0].FullName)
              if ($first.Length -lt 200 -or $first[0] -ne 77 -or $first[1] -ne 90) {
                throw "Missing executable PE MZ signature for $($tool.Id)"
              }
              if ($tool.Gui) {
                Write-Host "GUI FILE PRESENT, NOT LAUNCHED: $($tool.Id)"
              }
              else {
                # 7zr implements the legacy 7-Zip CLI, which intentionally has
                # no --version switch; its no-argument banner reports the version.
                $versionArgs = if ($tool.Id -eq '7zr') { @() } elseif ($tool.Id -eq 'miller') { @('version') } else { @('--version') }
                $versionOutput = (& $installed[0].FullName @versionArgs 2>&1 | Out-String)
                if ($tool.Id -eq '7zr') {
                  if ($versionOutput -notmatch '26.04') {
                    throw "7zr release/version output unexpected: $versionOutput"
                  }
                }
                elseif ($versionOutput -notmatch [regex]::Escape($tool.Version)) {
                  throw "$($tool.Id) reported wrong version: $versionOutput"
                }
                Write-Host "CLI VERSION PASS: $($tool.Id) $versionOutput"
              }
            }
            $bundleHash = (Get-FileHash -LiteralPath (Join-Path $root '.portakit-state.json') -Algorithm SHA256).Hash
            python -I scripts/toolsets.py apply portable-productivity --root "$root" --yes --offline-dir "$approved"
            if ($LASTEXITCODE -ne 0 -or
                (Get-FileHash -LiteralPath (Join-Path $root '.portakit-state.json') -Algorithm SHA256).Hash -ne $bundleHash) {
              throw 'Second-wave offline reapply did not preserve exact managed state'
            }
            foreach ($id in $newIds) {
              python -I portakit.py --root "$root" remove $id
              if ($LASTEXITCODE -ne 0) { throw "Second-wave cleanup failed: $id" }
            }
            python -I portakit.py --root "$root" remove jq
            if ($LASTEXITCODE -ne 0) { throw 'Toolset jq cleanup failed' }
            $state = Get-Content -LiteralPath (Join-Path $root '.portakit-state.json') -Raw | ConvertFrom-Json -AsHashtable
            if ($state.Count -ne 0) { throw "State not empty after removals: $($state.Keys -join ',')" }
            Write-Host 'Live SHA-256 verified archive checks and non-GUI smoke passed'
          }
          finally {
            if (Test-Path -LiteralPath $root) {
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction Stop
            }
          }

      - name: Upload Office prerequisite probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portakit-winmerge-office-prerequisites
          path: ${{ runner.temp }}/portakit-winmerge-office-prerequisites/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Office4 one-run ZIP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portakit-office4-one-run-evidence
          path: |
            ${{ runner.temp }}/portakit-office4-one-run.zip
            ${{ runner.temp }}/portakit-office4-one-run.zip.sha256.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload WinMerge runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portakit-winmerge-runtime-evidence
          path: ${{ runner.temp }}/portakit-winmerge-runtime-evidence/
          if-no-files-found: warn
          retention-days: 7
