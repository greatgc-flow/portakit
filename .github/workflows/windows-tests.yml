name: Windows tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# No write token or publishing credentials are required to run this suite.
permissions:
  contents: read

# Superseded runs on the same branch need not consume runner time.
concurrency:
  group: portakit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run offline regression suite
        run: python -I -m unittest discover -s tests -v

      - name: Verify CLI and catalog envelope (no downloads)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = python -I portakit.py --json list
          if ($LASTEXITCODE -ne 0) { throw "portakit list failed (exit $LASTEXITCODE)" }
          $result = $output | ConvertFrom-Json
          if (-not $result.ok -or $result.command -ne 'list' -or $result.data.items.Count -lt 3) {
            throw 'Unexpected catalog envelope or missing catalog tools'
          }
          python -I portakit.py --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "portakit help failed (exit $LASTEXITCODE)" }

      - name: Verify GUI acceptance and Sysinternals intake contracts (no launch)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -I -c "import ast,pathlib; ast.parse(pathlib.Path('scripts/gui_acceptance.py').read_text(encoding='utf-8'))"
          if ($LASTEXITCODE -ne 0) { throw 'GUI acceptance parser failed' }
          $meta = Get-Content -LiteralPath 'research/SYSINTERNALS_NETWORK_REVIEW_20261021.json' -Raw | ConvertFrom-Json
          $cat = Get-Content -LiteralPath 'catalog.json' -Raw | ConvertFrom-Json
          if ($meta.policy -ne 'METADATA_ONLY_NOT_INSTALLABLE_NOT_REDISTRIBUTABLE') {
            throw 'Sysinternals metadata-only policy must remain explicit'
          }
          $names = @($cat.tools | ForEach-Object { $_.id })
          foreach ($tool in @('tcpview', 'psping')) {
            if ($names -contains $tool) { throw "Unapproved Sysinternals catalog pin: $tool" }
          }
          if ($meta.tools.Count -ne 2) { throw 'Network vendor metadata count mismatch' }
          Write-Host 'GUI acceptance parser and no-Sysinternals-binary catalog gates PASS'

      - name: Parse Windows PowerShell acceptance scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'scripts/WinMerge-RuntimeSmoke.ps1',
            'scripts/WinMerge-OfficeAcceptance.ps1',
            'scripts/Run-WinMerge-Office4.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ('{0}: {1}' -f $path, $_) }
              throw "PowerShell parse errors in $path"
            }
            Write-Host "PowerShell syntax OK: $path"
          }

      - name: Compile Python evidence packager (no files modified)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('scripts/package_office_evidence.py',
                               'scripts/verify_office_evidence.py')) {
            python -I -c "import ast, pathlib, sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))" $path
            if ($LASTEXITCODE -ne 0) { throw "Evidence tool parse failed: $path" }
          }

      - name: Ephemeral HKCU classic Explorer menu registration and removal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ("portakit-menu-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          foreach ($item in @(@{Name='notepad++'; Exe='notepad++.exe'}, @{Name='winmerge'; Exe='WinMergeU.exe'})) {
            $dir = Join-Path $root $item.Name
            New-Item -ItemType Directory -Path $dir | Out-Null
            [System.IO.File]::WriteAllBytes((Join-Path $dir $item.Exe), [byte[]](1,2,3))
          }
          $state = @{
            'notepad++' = @{ version='CI'; dest='notepad++'; sha256=('a' * 64) }
            'winmerge' = @{ version='CI'; dest='winmerge'; sha256=('a' * 64) }
          } | ConvertTo-Json -Depth 4
          [System.IO.File]::WriteAllText((Join-Path $root '.portakit-state.json'), $state)
          try {
            foreach ($id in @('notepad++', 'winmerge')) {
              python -I scripts/context_menu.py install $id --root "$root"
              if ($LASTEXITCODE -ne 0) { throw "HKCU $id shell registration failed" }
              python -I scripts/context_menu.py install $id --root "$root"
              if ($LASTEXITCODE -ne 0) { throw "HKCU $id idempotency failed" }
              python -I scripts/context_menu.py status $id --root "$root"
              if ($LASTEXITCODE -ne 0) { throw "HKCU $id status failed" }
            }
            $checkPaths = @(
              'HKCU\Software\Classes\*\shell\PortaKit.NotepadPlusPlus.File\command',
              'HKCU\Software\Classes\*\shell\PortaKit.WinMerge.File\command',
              'HKCU\Software\Classes\Directory\shell\PortaKit.WinMerge.Folder\command'
            )
            foreach ($key in $checkPaths) {
              $output = & reg.exe query $key /ve
              if ($LASTEXITCODE -ne 0 -or -not ($output -match 'REG_SZ')) {
                throw "Missing HKCU Explorer shell command: $key"
              }
            }
            Write-Host 'All three real HKCU classic shell command keys verified'
          }
          finally {
            # Best effort cleanup is intentionally limited to PortaKit-owned keys.
            foreach ($id in @('notepad++', 'winmerge')) {
              python -I scripts/context_menu.py remove $id --root "$root"
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Unable to clean owned HKCU menu for $id on disposable CI runner"
              }
            }
            if (Test-Path -LiteralPath $root) {
              Remove-Item -LiteralPath $root -Recurse -Force
            }
          }
